services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:5173"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command:
      - sh
      - -ec
      - |
        # Vite expects package.json and postcss config at project root (where vite.config.js lives),
        # but this repo keeps them in docs/. Copy them on startup if missing.
        cp -n docs/package.json package.json
        cp -n docs/package-lock.json package-lock.json
        cp -n docs/postcss.config.js postcss.config.js
        npm ci
        exec npx vite --host 0.0.0.0 --port 5173
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: on-failure

volumes:
  node_modules:
